<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark Plate Background with Rounded Squircle -->
  <rect width="32" height="32" rx="7" fill="#0E0D0B"/>
  
  <!-- Subtle Border Frame -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="#C8643C" stroke-opacity="0.35"/>

  <!-- Isometric Foundation Plinth Top Surface -->
  <polygon points="16,5 27,11 16,17 5,11" fill="#16140F" stroke="#C8643C" stroke-width="1" stroke-linejoin="round"/>

  <!-- Left Receding Wall -->
  <polygon points="5,11 16,17 16,27 5,21" fill="#0E0D0B" stroke="#9E5D43" stroke-width="1" stroke-linejoin="round"/>

  <!-- Right Receding Wall -->
  <polygon points="27,11 16,17 16,27 27,21" fill="#1D1A14" stroke="#9E5D43" stroke-width="1" stroke-linejoin="round"/>

  <!-- Moroccan Keyhole Arch Aperture on Front-Right Face -->
  <path d="M 18,24 L 18,19 Q 18,17.5 20,17.5 Q 22,17.5 22,19 L 22,24" stroke="#F4EFE6" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  
  <!-- Glowing Center Keystone Dot -->
  <circle cx="20" cy="18.5" r="0.9" fill="#C8643C"/>
</svg>
