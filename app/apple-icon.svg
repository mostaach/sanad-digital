<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <!-- iOS App Icon Squircle Background -->
  <rect width="180" height="180" rx="40" fill="#0E0D0B"/>
  
  <!-- Subtle CAD Border -->
  <rect x="2" y="2" width="176" height="176" rx="38" stroke="#C8643C" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="90" cy="90" r="70" fill="#C8643C" fill-opacity="0.12"/>

  <!-- Scaled Foundation Plinth (Center at 90, 90) -->
  <g transform="translate(20, 20) scale(3.5)">
    <!-- Top Surface -->
    <polygon points="20,4 35,12 20,20 5,12" fill="#16140F" stroke="#C8643C" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Left Wall -->
    <polygon points="5,12 20,20 20,36 5,28" fill="#0E0D0B" stroke="#9E5D43" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Right Wall -->
    <polygon points="35,12 20,20 20,36 35,28" fill="#1D1A14" stroke="#9E5D43" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Moroccan Arch -->
    <path d="M 23,32 L 23,24 Q 23,21.5 25.5,21.5 Q 28,21.5 28,24 L 28,32" stroke="#F4EFE6" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <circle cx="25.5" cy="23.5" r="1.2" fill="#C8643C"/>

    <!-- Corner CAD Notches -->
    <circle cx="20" cy="4" r="1" fill="#F4EFE6"/>
    <circle cx="5" cy="28" r="0.9" fill="#C8643C"/>
    <circle cx="35" cy="28" r="0.9" fill="#C8643C"/>
  </g>
</svg>
