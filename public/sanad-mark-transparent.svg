<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 100 270 340" fill="none">
  <defs>
    <!-- Volumetric Ambient Orange Glow behind the S -->
    <radialGradient id="markAura" cx="256" cy="265" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.35"/>
      <stop offset="40%" stop-color="#C85016" stop-opacity="0.18"/>
      <stop offset="75%" stop-color="#8A2E0A" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Arm: Upper Facet -->
    <linearGradient id="tFacetUp" x1="285" y1="130" x2="145" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAE42"/>
      <stop offset="30%" stop-color="#FF8A24"/>
      <stop offset="100%" stop-color="#DE5E14"/>
    </linearGradient>

    <!-- Top Arm: Middle Cross Facet -->
    <linearGradient id="tFacetMid" x1="145" y1="210" x2="280" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF932E"/>
      <stop offset="60%" stop-color="#E26516"/>
      <stop offset="100%" stop-color="#B8440A"/>
    </linearGradient>

    <!-- Top Arm: Left Outer Wall -->
    <linearGradient id="tOuterWall" x1="145" y1="210" x2="145" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8480C"/>
      <stop offset="50%" stop-color="#732504"/>
      <stop offset="100%" stop-color="#2D0C02"/>
    </linearGradient>

    <!-- Top Arm: Front Vertical Wall -->
    <linearGradient id="tFrontWall" x1="145" y1="250" x2="280" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8F3006"/>
      <stop offset="40%" stop-color="#541802"/>
      <stop offset="100%" stop-color="#1C0700"/>
    </linearGradient>

    <!-- Top Arm: Inner Reflective Wall -->
    <linearGradient id="tInnerWall" x1="205" y1="195" x2="205" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8320" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4D1502" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Lower Arm: Bottom Return Facet -->
    <linearGradient id="bFacetRet" x1="365" y1="300" x2="225" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E86B18"/>
      <stop offset="65%" stop-color="#BA470B"/>
      <stop offset="100%" stop-color="#8F3006"/>
    </linearGradient>

    <!-- Lower Arm: Middle Slanted Facet -->
    <linearGradient id="bFacetMid" x1="230" y1="222" x2="365" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA438"/>
      <stop offset="50%" stop-color="#F0751C"/>
      <stop offset="100%" stop-color="#C44E0E"/>
    </linearGradient>

    <!-- Lower Arm: Outer Right Vertical Wall -->
    <linearGradient id="bOuterWall" x1="365" y1="300" x2="365" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D45B12"/>
      <stop offset="50%" stop-color="#852E05"/>
      <stop offset="100%" stop-color="#330F02"/>
    </linearGradient>

    <!-- Lower Arm: Bottom Vertical Drop Wall -->
    <linearGradient id="bDropWall" x1="365" y1="340" x2="225" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9C3507"/>
      <stop offset="50%" stop-color="#5E1D03"/>
      <stop offset="100%" stop-color="#240A01"/>
    </linearGradient>

    <filter id="markGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="265" r="160" fill="url(#markAura)"/>

  <!-- Light flares from apex points -->
  <g opacity="0.5" filter="url(#markGlow)">
    <line x1="285" y1="130" x2="330" y2="105" stroke="#FFAE42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="225" y1="380" x2="180" y2="405" stroke="#FFAE42" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Isometric S Geometry -->
  <g id="s-mark">
    <!-- Inner reflections -->
    <polygon points="208,175 285,130 285,188 208,233" fill="url(#tInnerWall)" opacity="0.85"/>
    <polygon points="304,337 227,382 227,324 304,279" fill="url(#tInnerWall)" opacity="0.85"/>

    <!-- Upper Arm -->
    <polygon points="144,212 188,237 188,295 144,270" fill="url(#tOuterWall)"/>
    <polygon points="285,130 317,148 188,223 156,205" fill="url(#tFacetUp)"/>
    <polygon points="156,205 188,223 188,237 144,212" fill="#FFAE42" opacity="0.9"/>
    <polygon points="144,270 188,295 292,235 248,210" fill="url(#tFacetMid)"/>
    <polygon points="188,295 292,235 292,285 188,345" fill="url(#tFrontWall)"/>

    <!-- Lower Arm -->
    <polygon points="220,277 264,302 368,242 324,217" fill="url(#bFacetMid)"/>
    <polygon points="368,242 368,300 324,325 324,267" fill="url(#bOuterWall)"/>
    <polygon points="356,307 368,300 324,325 312,332" fill="#FFAE42" opacity="0.9"/>
    <polygon points="368,300 324,325 195,400 239,425" fill="url(#bFacetRet)"/>
    <polygon points="324,325 195,400 195,435 324,360" fill="url(#bDropWall)"/>

    <!-- Specular Hairlines -->
    <line x1="285" y1="130" x2="156" y2="205" stroke="#FFF2D6" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="156" y1="205" x2="144" y2="212" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="144" y1="212" x2="144" y2="270" stroke="#FFAE42" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="144" y1="270" x2="292" y2="235" stroke="#FFE4B5" stroke-width="1.8" stroke-linecap="round"/>

    <line x1="220" y1="277" x2="368" y2="242" stroke="#FFE4B5" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="368" y1="242" x2="368" y2="300" stroke="#FFAE42" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="368" y1="300" x2="195" y2="400" stroke="#FFF2D6" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="195" y1="400" x2="239" y2="425" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>