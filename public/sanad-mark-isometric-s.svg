<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Squircle Gradient (Deep warm obsidian) -->
    <radialGradient id="sanadBgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#161411"/>
      <stop offset="65%" stop-color="#0E0D0B"/>
      <stop offset="100%" stop-color="#070605"/>
    </radialGradient>

    <!-- Volumetric Ambient Orange Glow behind the S -->
    <radialGradient id="sanadCoreAura" cx="256" cy="265" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#C85016" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#8A2E0A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Top Arm: Upper Facet (Bright sunlit amber-orange) -->
    <linearGradient id="topFacetUpper" x1="285" y1="130" x2="145" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFAE42"/>
      <stop offset="30%" stop-color="#FF8A24"/>
      <stop offset="100%" stop-color="#DE5E14"/>
    </linearGradient>

    <!-- Top Arm: Middle Cross Facet (sloping down-right toward center) -->
    <linearGradient id="topFacetMid" x1="145" y1="210" x2="280" y2="288" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF932E"/>
      <stop offset="60%" stop-color="#E26516"/>
      <stop offset="100%" stop-color="#B8440A"/>
    </linearGradient>

    <!-- Top Arm: Left Outer Vertical Wall (dropping into warm shadow) -->
    <linearGradient id="topOuterWall" x1="145" y1="210" x2="145" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B8480C"/>
      <stop offset="50%" stop-color="#732504"/>
      <stop offset="100%" stop-color="#2D0C02"/>
    </linearGradient>

    <!-- Top Arm: Front Vertical Drop Wall (under middle facet) -->
    <linearGradient id="topFrontWall" x1="145" y1="250" x2="280" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8F3006"/>
      <stop offset="40%" stop-color="#541802"/>
      <stop offset="100%" stop-color="#1C0700"/>
    </linearGradient>

    <!-- Top Arm: Inner Reflective Wall (facing the center slot) -->
    <linearGradient id="topInnerWall" x1="205" y1="195" x2="205" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8320" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4D1502" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Lower Arm: Bottom Return Facet (sloping down-left) -->
    <linearGradient id="botFacetReturn" x1="365" y1="300" x2="225" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E86B18"/>
      <stop offset="65%" stop-color="#BA470B"/>
      <stop offset="100%" stop-color="#8F3006"/>
    </linearGradient>

    <!-- Lower Arm: Middle Slanted Facet (sloping down-right) -->
    <linearGradient id="botFacetMid" x1="230" y1="222" x2="365" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA438"/>
      <stop offset="50%" stop-color="#F0751C"/>
      <stop offset="100%" stop-color="#C44E0E"/>
    </linearGradient>

    <!-- Lower Arm: Outer Right Vertical Wall -->
    <linearGradient id="botOuterWall" x1="365" y1="300" x2="365" y2="365" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D45B12"/>
      <stop offset="50%" stop-color="#852E05"/>
      <stop offset="100%" stop-color="#330F02"/>
    </linearGradient>

    <!-- Lower Arm: Bottom Vertical Drop Wall -->
    <linearGradient id="botDropWall" x1="365" y1="340" x2="225" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9C3507"/>
      <stop offset="50%" stop-color="#5E1D03"/>
      <stop offset="100%" stop-color="#240A01"/>
    </linearGradient>

    <!-- Corner Specular Flare Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="116" fill="url(#sanadBgGrad)"/>
  
  <!-- Outer Precision Hairline Frame -->
  <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" stroke="#38281D" stroke-width="1.5" stroke-opacity="0.8"/>
  <rect x="4" y="4" width="504" height="504" rx="112" stroke="#F4EFE6" stroke-width="0.75" stroke-opacity="0.04"/>

  <!-- Volumetric Core Aura -->
  <circle cx="256" cy="265" r="180" fill="url(#sanadCoreAura)"/>

  <!-- Ambient Light Streaks (Angled along the 30-deg isometric axis) -->
  <g opacity="0.45" filter="url(#subtleGlow)">
    <!-- Top-right corner flare -->
    <line x1="285" y1="130" x2="330" y2="105" stroke="#FFAE42" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="285" y1="130" x2="310" y2="145" stroke="#FFAE42" stroke-width="1" stroke-opacity="0.5"/>
    
    <!-- Bottom-left corner flare -->
    <line x1="225" y1="380" x2="180" y2="405" stroke="#FFAE42" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- ================= MASTER ISOMETRIC S MARK ================= -->
  <g id="sanad-isometric-s">

    <!-- === 1. TOP INTERIOR TRANSLUCENT REFLECTIONS (Glass depth) === -->
    <!-- Top inner vertical back wall -->
    <polygon points="208,175 285,130 285,188 208,233" fill="url(#topInnerWall)" opacity="0.85"/>
    <!-- Bottom inner vertical back wall -->
    <polygon points="304,337 227,382 227,324 304,279" fill="url(#topInnerWall)" opacity="0.85"/>

    <!-- === 2. UPPER S-ARM (Extruded Folded Prism) === -->
    <!-- A. Left Outer Vertical Drop Wall -->
    <polygon points="144,212 188,237 188,295 144,270" fill="url(#topOuterWall)"/>

    <!-- B. Upper Incline Top Face (sloping from top-right down to left elbow) -->
    <polygon points="285,130 317,148 188,223 156,205" fill="url(#topFacetUpper)"/>

    <!-- C. Left Elbow Transition Cap -->
    <polygon points="156,205 188,223 188,237 144,212" fill="#FFAE42" opacity="0.9"/>

    <!-- D. Middle Diagonal Top Face (sloping from left elbow down-right to center) -->
    <polygon points="144,270 188,295 292,235 248,210" fill="url(#topFacetMid)"/>

    <!-- E. Front Vertical Wall below middle face -->
    <polygon points="188,295 292,235 292,285 188,345" fill="url(#topFrontWall)"/>

    <!-- === 3. LOWER S-ARM (Interlocking Symmetrical Mirror) === -->
    <!-- F. Middle Diagonal Upper Face (sloping down-right from center) -->
    <polygon points="220,277 264,302 368,242 324,217" fill="url(#botFacetMid)"/>

    <!-- G. Right Outer Vertical Drop Wall -->
    <polygon points="368,242 368,300 324,325 324,267" fill="url(#botOuterWall)"/>

    <!-- H. Right Elbow Transition Cap -->
    <polygon points="356,307 368,300 324,325 312,332" fill="#FFAE42" opacity="0.9"/>

    <!-- I. Bottom Return Top Face (sloping from right elbow down-left) -->
    <polygon points="368,300 324,325 195,400 239,425" fill="url(#botFacetReturn)"/>

    <!-- J. Bottom Front Vertical Drop Wall -->
    <polygon points="324,325 195,400 195,435 324,360" fill="url(#botDropWall)"/>

    <!-- === 4. SPECULAR HAIRLINE CHAMFERS (Precision Crisp Edges) === -->
    <!-- Top arm upper ridge -->
    <line x1="285" y1="130" x2="156" y2="205" stroke="#FFF2D6" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="156" y1="205" x2="144" y2="212" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Top arm left outer drop edge -->
    <line x1="144" y1="212" x2="144" y2="270" stroke="#FFAE42" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Top arm middle diagonal ridge -->
    <line x1="144" y1="270" x2="292" y2="235" stroke="#FFE4B5" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Lower arm middle diagonal ridge -->
    <line x1="220" y1="277" x2="368" y2="242" stroke="#FFE4B5" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Lower arm right outer drop edge -->
    <line x1="368" y1="242" x2="368" y2="300" stroke="#FFAE42" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Lower arm bottom return ridge -->
    <line x1="368" y1="300" x2="195" y2="400" stroke="#FFF2D6" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Bottom tip chamfer -->
    <line x1="195" y1="400" x2="239" y2="425" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
